# Simple Docker Compose - Just CacheStorm

services:
  cachestorm:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile
    container_name: cachestorm-demo
    ports:
      - "6380:6380"
      - "8080:8080"
    volumes:
      - cachestorm-demo-data:/data
    environment:
      - CACHESTORM_MAX_MEMORY=512mb
      - CACHESTORM_REQUIREPASS=${CACHESTORM_REQUIREPASS:?set CACHESTORM_REQUIREPASS to the password clients must AUTH with}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  cachestorm-demo-data:

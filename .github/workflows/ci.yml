name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # Blocking since 2026-09-04 lint triage: all 711 pre-existing findings
      # were fixed or baselined in .golangci.yml (revive/prealloc disabled,
      # gocritic diagnostic+performance, SA2001 off for lock-coverage tests,
      # errcheck exclude-functions for best-effort writes). Keep it green.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

      - name: Test (race)
        run: go test -race ./internal/... -count=1

      - name: Govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26.10'

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # Blocking since 2026-09-04 lint triage: all 711 pre-existing findings
      # were fixed or baselined in .golangci.yml (revive/prealloc disabled,
      # gocritic diagnostic+performance, SA2001 off for lock-coverage tests,
      # errcheck exclude-functions for best-effort writes). Keep it green.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

      - name: Test (race)
        run: go test -race ./internal/... -count=1

      # Order sensitivity: run the fast internal packages three times over.
      # A single pass cannot see a test whose outcome depends on what an
      # earlier test left behind. The package-level registries -- the
      # time-series manager, the ACL user set and the replication manager --
      # outlive a single test, so the second pass found three tests that read
      # state another test had written and that a first pass passed.
      #
      # internal/command stays at -count=1 on purpose: one pass of that
      # package under -race already takes about 5 minutes and three passes
      # about 20 (1193 s measured), which does not fit this job's 20-minute
      # budget. Its order dependence is checked with the same command
      # locally: go test -race ./internal/command/ -count=3 -timeout=45m
      - name: Order sensitivity (count=3)
        run: go test -race $(go list ./internal/... | grep -v '/internal/command$') -count=3

      - name: Govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}

  # The Python, TypeScript and example modules are outside ./internal/..., so
  # the quality gate never built or tested them and every SDK defect found in
  # the 2026-10-20 review shipped with a green CI.
  sdk-python:
    name: Python client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        working-directory: clients/python
        run: python -B -m unittest discover -s tests -t . -v
      - name: Build wheel and sdist
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build
          python -m build

  sdk-typescript:
    name: TypeScript client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - working-directory: clients/typescript
        run: npm ci
      - working-directory: clients/typescript
        run: npm run typecheck
      - working-directory: clients/typescript
        run: npm test
      - working-directory: clients/typescript
        run: npm run build

  sdk-go-and-examples:
    name: Go client and examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test the Go client
        run: go test -race ./clients/... -count=1
      - name: Build and vet the example modules
        run: |
          for dir in examples/go examples/chat examples/analytics examples/e-commerce examples/realtime; do
            echo "::group::$dir"
            (cd "$dir" && go build -mod=readonly -o /dev/null ./... && go vet -mod=readonly ./...)
            echo "::endgroup::"
          done

  # Differential compatibility gate against real Redis. Known differences are
  # listed in tests/compat/verdicts_test.go and only logged; a new difference,
  # or a listed one that now matches Redis, fails the job.
  redis-compat:
    name: Redis compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Compare against redis:7.4-alpine
        env:
          COMPAT_RATCHET: '1'
          COMPAT_OUT: ${{ runner.temp }}/compat-report.md
        run: go test -tags compat -count=1 -v -timeout 15m ./tests/compat/
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-compat-report
          path: ${{ runner.temp }}/compat-report.md

  # Builds the root image and checks it as it ships: unprivileged user,
  # healthy, requirepass from the environment enforced, version stamped.
  docker-smoke:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and check the image
        run: scripts/docker-smoke.sh

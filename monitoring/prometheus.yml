global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # The metrics port (plugins.metrics) serves the exposition without
  # credentials, so scraping works when requirepass or the HTTP password is
  # set. Keep that port off untrusted networks; /api/metrics on the admin
  # port serves the same text behind the HTTP API's authentication.
  - job_name: 'cachestorm'
    static_configs:
      - targets: ['cachestorm:9090']
    metrics_path: /metrics
    scrape_interval: 5s

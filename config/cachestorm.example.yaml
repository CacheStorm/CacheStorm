# CacheStorm Configuration Example
# Copy this file to cachestorm.yaml and customize

# Server Configuration
server:
  # Bind address (0.0.0.0 for all interfaces)
  bind: "0.0.0.0"

  # TCP port for RESP server
  port: 6380

  # Maximum simultaneous connections
  max_connections: 10000

  # Number of logical databases (SELECT 0 .. databases-1)
  databases: 16

  # TCP keepalive in seconds
  tcp_keepalive: 300

  # Per-connection socket buffer sizes in bytes
  read_buffer_size: 4096
  write_buffer_size: 16384

  # Idle client timeout ("0" = never close idle clients, like Redis timeout 0)
  read_timeout: "0"
  # Timeout for writing a reply to a slow client ("0" = 5m default)
  write_timeout: "0"

  # Authentication password (empty = no auth required)
  # Clients must AUTH before running commands when set
  # (CACHESTORM_REQUIREPASS overrides this value)
  requirepass: ""

  # Protected mode: while no password is set, only clients connecting over
  # loopback are served; others get a DENIED error. Set a password instead
  # of disabling this unless the network is trusted.
  # (CACHESTORM_PROTECTED_MODE=false overrides this value)
  protected_mode: true

  # TLS Configuration (empty = plaintext)
  # tls_cert_file: "/etc/cachestorm/tls/server.crt"
  # tls_key_file: "/etc/cachestorm/tls/server.key"

# HTTP Admin API
http:
  enabled: true
  port: 8080
  # HTTP API password (empty = no auth)
  password: ""

# Memory Management
memory:
  # Maximum memory usage (0 = unlimited)
  # Examples: "1gb", "512mb", "256mb"
  max_memory: "0"

  # Eviction policy when memory limit is reached
  # Options: noeviction, allkeys-lru, allkeys-lfu, volatile-lru, allkeys-random
  eviction_policy: "allkeys-lru"

  # Memory pressure thresholds (percentage)
  pressure_warning: 70
  pressure_critical: 85

  # Number of keys to sample during eviction
  eviction_sample_size: 5

# Persistence Configuration
persistence:
  enabled: false

  # AOF (Append-Only File)
  aof: true
  # Sync policy: always, everysec, no
  aof_sync: "everysec"

  # Data directory for AOF/RDB files
  data_dir: "/var/lib/cachestorm"

  # Snapshot interval
  snapshot_interval: "5m"

  # Automatic AOF rewrite: once the AOF is at least aof_rewrite_min_size and
  # has grown by aof_rewrite_percentage since the last rewrite, it is
  # compacted. 0 disables automatic rewrites (BGREWRITEAOF still works).
  aof_rewrite_percentage: 100
  aof_rewrite_min_size: "64mb"

# Replication
replication:
  # Role: master, or replica (follows master_host:master_port)
  role: "master"
  # master_host: ""
  # master_port: 6380
  # master_auth: ""
  read_only: true

# Cluster mode: a single Redis Cluster node; nodes.conf lives in
# persistence.data_dir. Assign slots with CLUSTER ADDSLOTSRANGE 0 16383.
cluster:
  enabled: false
  # config_file: nodes.conf
  # bus_port: 0                  # 0 = port + 10000
  # announce_ip: ""
  # require_full_coverage: true
  # allow_reads_when_down: false

# Logging Configuration
logging:
  # Log level: debug, info, warn, error
  level: "info"
  # Log format: console, json
  format: "console"
  # Output: stdout, stderr
  output: "stdout"

# Plugin Configuration
plugins:
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
  slowlog:
    enabled: true
    threshold: "10ms"
    max_entries: 128

# Sentinel role: monitor masters and listen for sentinel peers. A data server
# leaves this off; enable it on the instances that act as sentinels.
sentinel:
  enabled: false
  addr: "127.0.0.1"
  port: 26379
  quorum: 2
  down_after: "30s"
  failover_time: "3m"

version: "2"
run:
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  # prealloc and revive were removed 2026-09-04 during lint triage:
  # - prealloc: 96 performance hints that need benchmark validation, not
  #   lint enforcement. Re-enable selectively for hot paths.
  # - revive: 127 findings, all style churn (77 redefines-builtin-id, 18
  #   exported-doc, rest var/receiver style). staticcheck + gocritic + govet
  #   remain the correctness layer.
  enable:
    - gocritic
    - misspell
  settings:
    errcheck:
      # check-type-assertions off (triage 2026-09-04): the codebase's
      # deliberate zero-value idiom (`v, _ := m[k].(T)` safe accessors)
      # emitted ~34 findings of intentional behavior.
      check-type-assertions: false
      check-blank: true
      exclude-functions:
        # Best-effort parsing: dev-tool/lua args fall back to zero values
        # by design.
        - fmt.Sscanf
        # Buffered AOF record writes: errors surface at Flush/Sync, which
        # are checked.
        - (*bufio.Writer).WriteString
        - (*bufio.Writer).WriteByte
        - (*bufio.Writer).Write
        # Best-effort socket tuning: failures only matter on an already
        # broken connection.
        - (net.Conn).SetReadDeadline
        - (net.Conn).SetWriteDeadline
        - (*net.TCPConn).SetKeepAlive
        - (*net.TCPConn).SetKeepAlivePeriod
        # Writing the embedded admin UI to the client is best-effort.
        - (net/http.ResponseWriter).Write
        # Baseline (triage 2026-09-04): command handlers reply best-effort;
        # propagating store.Set errors (e.g. OOM) into responses is a
        # tracked hardening task.
        - (*github.com/cachestorm/cachestorm/internal/store.Store).Set
        # Response writes are best-effort: a disconnected client makes them
        # fail and there is nothing left to report to.
        - (*github.com/cachestorm/cachestorm/internal/resp.Writer).WriteValue
        - (*github.com/cachestorm/cachestorm/internal/resp.Writer).WriteValueNoFlush
        - (*github.com/cachestorm/cachestorm/internal/resp.Writer).WriteSimpleString
        - (*github.com/cachestorm/cachestorm/internal/resp.Writer).WriteError
        - (*github.com/cachestorm/cachestorm/internal/resp.Writer).WriteInteger
        - (*github.com/cachestorm/cachestorm/internal/resp.Writer).WriteBulkString
        - (*github.com/cachestorm/cachestorm/internal/resp.Writer).WriteBulkBytes
        - (*github.com/cachestorm/cachestorm/internal/resp.Writer).WriteNullBulkString
        - (*github.com/cachestorm/cachestorm/internal/resp.Writer).WriteNull
        - (*github.com/cachestorm/cachestorm/internal/resp.Writer).WriteNullArray
        - (*github.com/cachestorm/cachestorm/internal/resp.Writer).WriteArray
        - (*github.com/cachestorm/cachestorm/internal/resp.Writer).WriteOK
        - (*github.com/cachestorm/cachestorm/internal/resp.Writer).WritePONG
        - (*github.com/cachestorm/cachestorm/internal/resp.Writer).WriteQueued
        - (*github.com/cachestorm/cachestorm/internal/resp.Writer).WriteZero
        - (*github.com/cachestorm/cachestorm/internal/resp.Writer).WriteOne
        - (*github.com/cachestorm/cachestorm/internal/command.Context).WriteOK
        # In-memory buffers cannot fail.
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteString
        - (*bytes.Buffer).WriteByte
        - (*strings.Builder).WriteString
        - (*strings.Builder).WriteByte
    gocritic:
      disabled-checks:
        - captLocal # `L` is the conventional gopher-lua state param name
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
      # diagnostics + performance only: the style/opinionated/experimental
      # tags emitted ~100 findings of pure style churn (triage 2026-09-04).
      enabled-tags:
        - diagnostic
        - performance
    govet:
      disable:
        - fieldalignment
        # shadow is notoriously noisy: if-scoped `err :=` redeclarations are
        # idiomatic Go. Disabled during lint triage 2026-09-04 (7 findings).
        - shadow
      enable-all: true
    staticcheck:
      checks:
        - all
        # SA2001 (empty critical section): internal/command/coverage_test.go
        # intentionally locks/unlocks with empty bodies to exercise the
        # mutex coverage tests (37 findings, all in that file).
        - -SA2001
        # golangci v2 defaults: style checks already covered by the enabled
        # formatter/formatter-adjacent gates.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1023
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
          - govet
        path: _test\.go
      - linters:
          - errcheck
        path: cmd/benchmark/
      - linters:
          - errcheck
          - gocritic
        path: internal/resp/
      - linters:
          - errcheck
        path: examples/
      - linters:
          - errcheck
          - gocritic
        path: clients/
      - linters:
          - errcheck
        path: test_client\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/cachestorm/cachestorm
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
